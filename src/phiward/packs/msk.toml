# EXAMPLE sanitizer pack: the identifier forms of one institution (MSK) and an example path
# layout. It is not a default; name it in the config to use it:
#   [sanitize]
#   packs = ["genomics", "msk"]
# Copy it and change the rules for another institution. The format is described at the top of
# genomics.toml.
#
# Two rules are examples of a project's folder layout, not facts about any institution:
#   <PATIENTPATH>  any path token holding inputs/patient
#   <CLINICALPATH> any path token under /clinical/ (a made-up share of clinical data; change
#                  the prefix to your own)
# They run first (the `paths` list), so a clinical path is masked as a whole before a file-name
# rule sees it.
[pack]
name = "msk"

paths = [
  '[^\s\x27\x22=,;()\[\]]*inputs/patient[^\s\x27\x22=,;()\[\]]* => <PATIENTPATH>',
  '[^\s\x27\x22=,;()\[\]]*/clinical/[^\s\x27\x22=,;()\[\]]* => <CLINICALPATH>',
]

identifiers = [
  # sample and patient IDs: P-0000000-T01-IM6 and forms like it
  '\bP-\d{4,}(?:-[A-Za-z]\d{1,3})?(?:[-_][A-Za-z0-9]+)* => <SAMPLEID>',
  # CMO IDs: C-ABC123-L001-d, s_C_ABC123_P001_d
  '\bC-\w{6}(?:[-_]\w+)* => <CMOID>',
  '\bs_C_\w+ => <CMOID>',
  # anonymized BAM stems: AB123456-T
  '\b[A-Z]{2}\d{6}-[A-Z]\b => <BAMID>',
  # donor names
  '\bDonor[\w\-]+|\bDONOR[\w\-]+ => <DONOR>',
]
