# Built-in sanitizer pack: generic genomics masks. Format of a pack file (also for packs you
# write yourself and name by path in `[sanitize] packs = ["path/to/pack.toml"]`):
#
#   [pack]
#   name        = "..."           optional, for humans
#   paths       = [ RULE, ... ]   applied first, over all packs, before the identifier rules
#   identifiers = [ RULE, ... ]   applied in text mode AND table mode, in any letter case
#   positions   = [ RULE, ... ]   text mode only (numbers and positions)
#   keep_files  = [ REGEX, ... ]  whole file names that a <BAMFILE> rule leaves alone
#
# A RULE is 'REGEX => <PLACEHOLDER>': a Python regular expression, then " => ", then a
# placeholder in capitals between angle brackets. Write the regex as a TOML literal string
# ('...') so that backslashes stay as they are; for a quote character use \x27 or \x22.
# A rule that matches the empty string is refused. Rules run in file order. After all rules a
# second pass must change nothing, else the line is withheld.
[pack]
name = "genomics"

identifiers = [
  # sequence and alignment file names (a path token ending in one), unless in keep_files;
  # a match starts only where a token starts, so a long line stays linear
  '(?i)(?<![^\s\x27\x22=,;()\[\]])[^\s\x27\x22=,;()\[\]]+\.(?:bam|cram|bai|crai|csi|sam|fastq|fq|bcf|vcf)(?:\.gz|\.bgz)?\b => <BAMFILE>',
  # read names: Illumina and Casava colon forms (5 or more fields), with /1, #0, _UMI, +UMI tails;
  # a match starts only where a word starts (leading `_ . -` are taken too), so a long word
  # stays linear
  '(?<![A-Za-z0-9_.\-])[_.\-]*[A-Za-z0-9](?:[A-Za-z0-9_\-]+(?:\.[A-Za-z0-9_\-]+)*)?(?::[A-Za-z0-9_\-]+(?:\.[A-Za-z0-9_\-]+)*){4,}(?:[/#+][A-Za-z0-9+\-]*)* => <READ>',
  # PacBio movie names
  '\bm\d{5}[A-Za-z]?_\d{6}_\d{6}/\d+(?:/\w+)? => <READ>',
]

positions = [
  # chr1:123, 12:123456, chr2:1,234,567-1,300,000
  '\b(?:[Cc]hr(?:\d{1,2}|[XYM]|MT)|\d{1,2}|X|Y|MT)\s*:\s*\d[\d,]*(?:\s*-\s*\d[\d,]*)? => <LOCUS>',
  # chrX 12345
  '\b(?:[Cc]hr(?:\d{1,2}|[XYM]|MT)|X|Y|MT)[\t ]+\d{3,} => <LOCUS>',
  # 1_1234_A_C and chr7-55249071-C-T style variant IDs
  '\b(?:[Cc]hr)?(?:\d{1,2}|X|Y|MT)[_.\-]\d{3,}(?:[_\-][ACGTN]+)+ => <LOCUS>',
  # VCF-like rows: a chromosome cell, a tab, a position cell
  '(?:^|(?<=\t))\d{1,2}\t\d{3,} => <LOCUS>',
  # comma-grouped numbers of a million or more, then bare runs of five or more digits; a comma
  # is no exception (a CSV row), only a decimal point is (12345.678 is a measurement)
  '(?<![\d,])\d{1,3}(?:,\d{3}){2,}(?![\d,]) => <NUM>',
  '(?<!\d)(?<!\d\.)\d{5,}(?!\d)(?!\.\d) => <NUM>',
]

# neutral work names: they carry no identity
keep_files = [
  'slice\.bam(?:\.bai)?',
  'rows(?:_b37)?\.vcf',
  'b\d\d\.(?:bam|cram)(?:\.bai|\.crai|\.csi)?',
  'b\d\d\.(?:bai|crai|csi)',
]
