name: docs

# Builds the documentation site with --strict on every pull request that touches it and on every
# push below. Publishes versioned docs with mike to the gh-pages branch, as gbcms and krewlyzer do:
# develop as "dev", a release tag vX as "X" with the alias "stable", which is the default.
# GitHub Pages serves that branch (Settings > Pages > Deploy from a branch: gh-pages, / (root)).
on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Build (a broken link or anchor fails it)
        run: |
          python -m pip install mkdocs==1.6.1 mkdocs-material==9.8.1
          mkdocs build --strict

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mike pushes the gh-pages branch
    # one deploy at a time: mike fetches, changes and pushes gh-pages, so two at once would clash
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.8.1 mike==2.2.0
      - name: Prepare gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true  # absent before the first deploy
      - name: Deploy develop as "dev"
        if: github.ref == 'refs/heads/develop'
        run: mike deploy --push --update-aliases dev develop
      - name: Deploy the release as its version and "stable"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mike deploy --push --update-aliases "$version" stable
          mike set-default --push stable
