name: release

# A tag such as v0.2.0b1 builds the package, checks it, and publishes it to PyPI with trusted
# publishing (OpenID Connect): no PyPI token is stored in GitHub. PyPI
# must list this repository and this workflow file as a trusted publisher of the project
# `phiward` (docs/releasing.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # the whole test suite on macOS and Linux first: a tag on a red commit publishes nothing
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # the history of main, for the check below
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tag is not on main"; exit 1; }
      - name: The tag names the version everywhere it is written
        run: |
          python - <<'PY'
          import json, os, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          init = open("src/phiward/__init__.py").read()
          found = {"src/phiward/__init__.py": re.search(r'__version__ = "([^"]+)"', init).group(1),
                   "plugin/.claude-plugin/plugin.json":
                       json.load(open("plugin/.claude-plugin/plugin.json"))["version"]}
          for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]:
              found[".claude-plugin/marketplace.json " + p["name"]] = p["version"]
          bad = {k: v for k, v in found.items() if "v" + v != tag}
          if bad:
              sys.exit(f"tag {tag}, but: {bad}")
          # the install lines and links the docs carry, and the changelog's date
          import glob
          ver = tag[1:]
          # pins: phiward==X, /blob/vX/, #vX, phiward@vX, "ref": "vX" and the "Status: vX" lines
          pins = (r"phiward==([0-9](?:[\w.+-]*\w)?)|/blob/v([0-9][^/\s]*)/|#v([0-9](?:[\w.+-]*\w)?)"
                  r"|phiward@v([0-9](?:[\w.+-]*\w)?)|\"ref\":\s*\"v([0-9][^\"]*)\""
                  r"|Status:\**\s*v([0-9](?:[\w.+-]*\w)?)")
          for f in ["README.md", "CHANGELOG.md", "plugin/commands/setup.md"] + glob.glob("docs/*.md"):
              text = open(f).read()
              for m in re.finditer(pins, text):
                  v = next(g for g in m.groups() if g)
                  if v != ver:
                      bad[f] = v
          if "unreleased" in open("CHANGELOG.md").read().split("\n## ", 2)[1].splitlines()[0].lower():
              bad["CHANGELOG.md"] = "the newest entry still says unreleased"
          if bad:
              sys.exit(f"tag {tag}, but: {bad}")
          PY
      - name: Build
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - name: The built wheel installs and runs
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          /tmp/try/bin/phiward --version
          /tmp/try/bin/phiward sanitize --selftest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          print-hash: true
